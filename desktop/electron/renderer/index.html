<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plansheet Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <label class="field-label" for="monthButton">Month</label>
        <div class="month-row">
          <button id="monthButton" class="month-button" type="button" aria-haspopup="dialog" aria-expanded="false">----</button>
          <button id="toggleInputButton" class="btn btn-muted" type="button">Generation Input</button>
        </div>
        <div id="monthPicker" class="month-picker hidden" role="dialog" aria-label="Select month">
          <div class="month-picker-head">
            <button id="monthPrevYear" class="btn btn-muted btn-icon" type="button" aria-label="Previous year">&lt;</button>
            <div id="monthPickerYear" class="month-picker-year">----</div>
            <button id="monthNextYear" class="btn btn-muted btn-icon" type="button" aria-label="Next year">&gt;</button>
          </div>
          <div id="monthGrid" class="month-grid">
            <button class="month-cell" type="button" data-month="01">Jan</button>
            <button class="month-cell" type="button" data-month="02">Feb</button>
            <button class="month-cell" type="button" data-month="03">Mar</button>
            <button class="month-cell" type="button" data-month="04">Apr</button>
            <button class="month-cell" type="button" data-month="05">May</button>
            <button class="month-cell" type="button" data-month="06">Jun</button>
            <button class="month-cell" type="button" data-month="07">Jul</button>
            <button class="month-cell" type="button" data-month="08">Aug</button>
            <button class="month-cell" type="button" data-month="09">Sep</button>
            <button class="month-cell" type="button" data-month="10">Oct</button>
            <button class="month-cell" type="button" data-month="11">Nov</button>
            <button class="month-cell" type="button" data-month="12">Dec</button>
          </div>
          <div class="month-picker-foot">
            <button id="monthThis" class="btn btn-muted" type="button">This month</button>
          </div>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="generateButton" class="btn btn-primary" type="button">Generate</button>
        <button id="saveButton" class="btn btn-success hidden" type="button">Save</button>
        <button id="removeButton" class="btn btn-danger hidden" type="button">Remove</button>
        <button id="undoButton" class="btn btn-muted hidden" type="button">Undo</button>
      </div>
    </header>

    <section class="statusbar">
      <div id="statusText" class="status-text">Starting backend...</div>
      <div id="busyText" class="busy-text"></div>
    </section>

    <main class="content-grid">
      <section class="panel panel-table">
        <div id="emptyState" class="empty-state hidden">
          <h1>No Plansheet</h1>
          <p>Generate a monthly plansheet to begin editing.</p>
        </div>

        <div id="tableWrap" class="table-wrap hidden">
          <table id="plansheetTable" class="plansheet-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="drawerOverlay" class="drawer-overlay"></div>
    <aside id="inputDrawer" class="input-drawer" aria-hidden="true">
      <div class="input-drawer-header">
        <h2>Generation Input</h2>
        <div class="drawer-actions">
          <button id="saveInputButton" class="btn btn-success hidden" type="button" title="Save generation input">Save</button>
          <button id="closeInputButton" class="btn btn-muted btn-icon" type="button" aria-label="Close generation input panel" title="Close">
            <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
              <path d="M6.4 5l5.6 5.6L17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4 6.4 5z" />
            </svg>
          </button>
        </div>
      </div>
      <div class="input-drawer-body">
        <div id="inputForm" class="input-form"></div>
      </div>
    </aside>

    <div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
